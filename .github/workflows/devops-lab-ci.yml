name: DevOps lab CI

on:
  pull_request:
    paths: ["devops-practice-lab/**", ".github/workflows/devops-lab-ci.yml"]
  push:
    branches: [main]
    paths: ["devops-practice-lab/**", ".github/workflows/devops-lab-ci.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: devops-practice-lab

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.2"
      - name: Unit and repository checks
        run: make verify
      - name: Terraform format
        run: terraform -chdir=infra/terraform fmt -check -recursive
      - name: Terraform validate
        run: terraform -chdir=infra/terraform init -backend=false && terraform -chdir=infra/terraform validate
      - name: Build image
        run: make build
      - name: Scan image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: devops-practice-lab:local
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Compose smoke test
        run: docker compose up -d redis api worker && make smoke
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose down --remove-orphans

name: DevOps lab manual deployment

on:
  workflow_dispatch:
    inputs:
      image:
        description: Immutable GHCR image reference including tag
        required: true
      aws_region:
        description: AWS region containing the short-lived lab host
        required: true
        default: ap-southeast-1

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    environment: devops-lab
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}
      - name: Deploy immutable image through Systems Manager
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          test -n "$IMAGE"
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters Name=tag:Project,Values=devops-practice-lab Name=instance-state-name,Values=running \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          test "$INSTANCE_ID" != "None"
          COMMAND_ID=$(aws ssm send-command \
            --targets Key=tag:Project,Values=devops-practice-lab \
            --document-name AWS-RunShellScript \
            --parameters commands="docker pull $IMAGE,docker network create lab || true,docker rm -f lab-redis lab-api lab-worker || true,docker run -d --name lab-redis --network lab --restart unless-stopped redis:7.2-alpine,docker run -d --name lab-api --network lab --restart unless-stopped -p 8080:8080 -e REDIS_HOST=lab-redis $IMAGE,docker run -d --name lab-worker --network lab --restart unless-stopped -e REDIS_HOST=lab-redis $IMAGE python -m src.worker,sleep 5,curl --fail http://127.0.0.1:8080/health/ready" \
            --query 'Command.CommandId' --output text)
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"

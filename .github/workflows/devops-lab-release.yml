name: DevOps lab release

on:
  push:
    tags: ["devops-lab-v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify source and build the release candidate once
        run: |
          make -C devops-practice-lab verify
          docker build -t devops-lab-release-candidate devops-practice-lab/app
      - name: Scan release candidate
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: devops-lab-release-candidate
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/devops-practice-lab
          tags: |
            type=ref,event=tag
            type=sha
      - name: Publish the verified candidate under immutable tags
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            test -n "$tag" || continue
            docker tag devops-lab-release-candidate "$tag"
            docker push "$tag"
          done <<< "$TAGS"

name: devops-practice-lab

services:
  redis:
    image: redis:7.2-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  api:
    build: ./app
    image: devops-practice-lab:local
    environment:
      APP_PORT: "8080"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      RESPONSE_DELAY_MS: ${RESPONSE_DELAY_MS:-0}
      ERROR_RATE: ${ERROR_RATE:-0}
      FORCE_UNREADY: ${FORCE_UNREADY:-false}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      redis:
        condition: service_healthy
    networks: [frontend, backend]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]

  worker:
    image: devops-practice-lab:local
    command: ["python", "-m", "src.worker"]
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      redis:
        condition: service_healthy
    networks: [backend]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]

  prometheus:
    image: prom/prometheus:v2.53.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=1d"]
    volumes:
      - ./platform/prometheus:/etc/prometheus:ro
    ports: ["9090:9090"]
    networks: [frontend]
    depends_on: [api]

  loki:
    image: grafana/loki:3.1.1
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports: ["3100:3100"]
    networks: [frontend]

  promtail:
    image: grafana/promtail:3.1.1
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./platform/promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [frontend]
    depends_on: [loki]

  grafana:
    image: grafana/grafana:11.1.4
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./platform/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./platform/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    networks: [frontend]
    depends_on: [prometheus, loki]

networks:
  frontend:
  backend:
    internal: true
